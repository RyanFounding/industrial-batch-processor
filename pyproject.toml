# Tool configuration. Runtime dependencies live in requirements.txt, which
# Streamlit Community Cloud installs for the live demo.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["spec_extractor", "industrial_app.py"]
